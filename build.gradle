buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21"
        // v29: NO separate kotlin-parcelize classpath — that artifact does
        // not exist on Maven Central (404). The kotlin-parcelize plugin is
        // bundled inside kotlin-gradle-plugin; :nobifile applies it with
        // `apply plugin: 'kotlin-parcelize'` (same as the Material Files
        // fork, whose root build.gradle only has kotlin-gradle-plugin).
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}
